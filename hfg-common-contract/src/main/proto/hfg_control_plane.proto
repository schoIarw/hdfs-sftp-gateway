syntax = "proto3";
package hfg.control.v1;
option java_multiple_files = true;
option java_package = "io.github.scholiarw.hfg.control.v1";
option java_outer_classname = "HfgControlPlaneProto";

service HfgControlPlane {
  rpc SubscribeSnapshots(SubscribeSnapshotsRequest) returns (stream SnapshotEnvelope);
  rpc Heartbeat(GatewayHeartbeat) returns (HeartbeatAck);
  rpc GetHdfsBundle(HdfsBundleRequest) returns (HdfsBundleResponse);
  rpc GetGatewayConfiguration(GatewayConfigurationRequest) returns (GatewayConfigurationResponse);
  rpc ReportTransferEvents(TransferEventsRequest) returns (OperationAck);
  rpc ReserveQuota(QuotaReserveRequest) returns (QuotaReservationResponse);
  rpc RenewQuota(QuotaRenewRequest) returns (OperationAck);
  rpc CommitQuota(QuotaCommitRequest) returns (OperationAck);
}

message SubscribeSnapshotsRequest {
  string gateway_id = 1;
  string service_group_id = 2;
  int64 current_version = 3;
}

message SnapshotEnvelope {
  string payload_json = 1;
  string payload_sha256 = 2;
  string signature_base64 = 3;
}

message GatewayHeartbeat {
  string gateway_id = 1;
  string service_group_id = 2;
  string hostname = 3;
  string role = 4;
  string management_address = 5;
  string software_version = 6;
  int64 snapshot_version = 7;
  string ip_address = 8;
  int32 ftp_port = 9;
  int32 sftp_port = 10;
  int32 management_port = 11;
  string runtime_status = 12;
  string last_error = 13;
}

message HeartbeatAck {
  int64 server_epoch_millis = 1;
  int64 latest_snapshot_version = 2;
}

message HdfsBundleRequest {
  string gateway_id = 1;
  string service_group_id = 2;
}

message HdfsBundleResponse {
  bytes zip = 1;
  string sha256 = 2;
}

message GatewayConfigurationRequest {
  string gateway_id = 1;
  string service_group_id = 2;
}

message GatewayConfigurationResponse {
  string ftp_passive_external_address = 1;
}

message TransferEventsRequest {
  string gateway_id = 1;
  string service_group_id = 2;
  repeated string event_json = 3;
}

message QuotaReserveRequest {
  string gateway_id = 1;
  string service_group_id = 2;
  string user_id = 3;
  string direction = 4;
  int64 files = 5;
  int64 bytes = 6;
}

message QuotaReservationResponse {
  string id = 1;
  int64 files = 2;
  int64 bytes = 3;
}

message QuotaRenewRequest {
  string gateway_id = 1;
  string service_group_id = 2;
  string reservation_id = 3;
}

message QuotaCommitRequest {
  string gateway_id = 1;
  string service_group_id = 2;
  string reservation_id = 3;
  int64 completed_files = 4;
  int64 completed_bytes = 5;
}

message OperationAck {}
