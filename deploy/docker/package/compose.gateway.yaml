services:
  hfg-gateway:
    image: hfg-gateway:${HFG_VERSION:-0.1.6}
    platform: linux/amd64
    network_mode: host
    restart: unless-stopped
    user: "10001:10001"
    cap_add: [NET_BIND_SERVICE]
    env_file:
      - /etc/hfg/hfg-gateway.env
      - /etc/hfg/hfg-gateway-bootstrap.env
    volumes:
      - /var/lib/hfg:/var/lib/hfg
      - /etc/hfg:/etc/hfg:ro
      - /etc/krb5.conf:/etc/krb5.conf:ro
