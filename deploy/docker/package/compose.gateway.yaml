services:
  hfg-gateway:
    image: hfg-gateway:${HFG_VERSION:-0.1.3}
    platform: linux/amd64
    network_mode: host
    restart: unless-stopped
    user: "10001:10001"
    cap_add: [NET_BIND_SERVICE]
    env_file: [/etc/hfg/hfg-gateway.env]
    volumes:
      - /var/lib/hfg:/var/lib/hfg
      - /etc/hfg:/etc/hfg:ro
