global: {scrape_interval: 15s, evaluation_interval: 15s}
rule_files: [/etc/prometheus/hfg-rules.yaml]
scrape_configs:
  - job_name: hfg-gateway
    static_configs: [{targets: ["hfg-gateway-01:18080", "hfg-gateway-02:18080"]}]
    metrics_path: /actuator/prometheus
  - job_name: hfg-manager
    static_configs: [{targets: ["hfg-manager:8080"]}]
    metrics_path: /actuator/prometheus
