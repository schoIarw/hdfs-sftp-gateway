groups:
  - name: hfg-runtime
    rules:
      - alert: HfgInstanceDown
        expr: up{job=~"hfg-manager|hfg-gateway"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HFG instance is unavailable"
      - alert: HfgJvmHeapHigh
        expr: |
          sum by (application, instance) (jvm_memory_used_bytes{area="heap"})
          /
          clamp_min(sum by (application, instance) (jvm_memory_max_bytes{area="heap"}), 1)
          > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "HFG JVM heap usage is above 90%"
      - alert: HfgProcessCpuHigh
        expr: process_cpu_usage{application=~"hfg-manager-api|hfg-gateway"} > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "HFG process CPU usage is above 90%"
      - alert: HfgDatabasePoolExhausted
        expr: hikaricp_connections_pending{application="hfg-manager-api"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HFG database connection pool has pending requests"
      - alert: HfgTransferCapacityWaiting
        expr: hfg_transfers_waiting{application="hfg-gateway"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "HFG gateway transfers are continuously waiting for capacity"
      - alert: HfgTransferCapacityRejected
        expr: rate(hfg_transfers_rejected_total{application="hfg-gateway"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HFG gateway is rejecting transfers after the capacity wait timeout"
