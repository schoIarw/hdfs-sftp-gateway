name: verify
on:
  push: {branches: [main]}
  pull_request: {}
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hfg
          POSTGRES_USER: hfg
          POSTGRES_PASSWORD: hfg-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hfg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HFG_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/hfg
      HFG_DB_URL: jdbc:postgresql://127.0.0.1:5432/hfg
      HFG_DB_USERNAME: hfg
      HFG_DB_PASSWORD: hfg-test-password
      HFG_ADMIN_PASSWORD: hfg-test-admin-password
      HFG_RPC_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17, cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: hfg-manager-web/package-lock.json}
      - run: npm ci && npm run lint && npm test -- --run && npm run build
        working-directory: hfg-manager-web
      - run: ./mvnw --batch-mode -Dhfg.bundle-web=true clean verify
      - run: unzip -l hfg-manager-api/target/hfg-manager-api-*.jar | grep -q 'BOOT-INF/classes/static/index.html'
      - uses: actions/upload-artifact@v4
        with: {name: hfg-sbom, path: target/bom.json}

  mysql-context:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hfg
          MYSQL_USER: hfg
          MYSQL_PASSWORD: hfg-test-password
          MYSQL_ROOT_PASSWORD: hfg-test-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -phfg-test-root-password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      HFG_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/hfg?serverTimezone=UTC
      HFG_DB_URL: jdbc:mysql://127.0.0.1:3306/hfg?serverTimezone=UTC
      HFG_DB_MIGRATION_LOCATION: classpath:db/mysql
      HFG_UUID_JDBC_TYPE: CHAR
      HFG_DB_USERNAME: hfg
      HFG_DB_PASSWORD: hfg-test-password
      HFG_ADMIN_PASSWORD: hfg-test-admin-password
      HFG_RPC_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17, cache: maven}
      - run: >-
          ./mvnw --batch-mode -pl hfg-manager-api -am
          -Dtest=ManagerContextIntegrationTest,BusinessLogsIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false test
