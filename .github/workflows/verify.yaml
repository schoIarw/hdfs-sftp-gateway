name: verify
on:
  push: {branches: [main]}
  pull_request: {}
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hfg
          POSTGRES_USER: hfg
          POSTGRES_PASSWORD: hfg-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hfg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HFG_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/hfg
      HFG_DB_URL: jdbc:postgresql://127.0.0.1:5432/hfg
      HFG_DB_USERNAME: hfg
      HFG_DB_PASSWORD: hfg-test-password
      HFG_ADMIN_PASSWORD: hfg-test-admin-password
      HFG_RPC_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17, cache: maven}
      - run: ./mvnw --batch-mode clean verify
      - uses: actions/upload-artifact@v4
        with: {name: hfg-sbom, path: target/bom.json}
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: hfg-manager-web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: hfg-manager-web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
