name: verify
on:
  push: {branches: [main]}
  pull_request: {}
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hfg
          POSTGRES_USER: hfg
          POSTGRES_PASSWORD: hfg-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hfg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HFG_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/hfg
      HFG_DB_URL: jdbc:postgresql://127.0.0.1:5432/hfg
      HFG_DB_USERNAME: hfg
      HFG_DB_PASSWORD: hfg-test-password
      HFG_ADMIN_PASSWORD: hfg-test-admin-password
      HFG_RPC_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17, cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: hfg-manager-web/package-lock.json}
      - run: npm ci && npm run lint && npm test -- --run && npm run build
        working-directory: hfg-manager-web
      - run: ./mvnw --batch-mode -Dhfg.bundle-web=true clean verify
      - run: unzip -l hfg-manager-api/target/hfg-manager-api-*.jar | grep -q 'BOOT-INF/classes/static/index.html'
      - uses: actions/upload-artifact@v4
        with: {name: hfg-sbom, path: target/bom.json}

  mysql-context:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hfg
          MYSQL_USER: hfg
          MYSQL_PASSWORD: hfg-test-password
          MYSQL_ROOT_PASSWORD: hfg-test-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -phfg-test-root-password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      HFG_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/hfg?serverTimezone=UTC
      HFG_DB_URL: jdbc:mysql://127.0.0.1:3306/hfg?serverTimezone=UTC
      HFG_DB_MIGRATION_LOCATION: classpath:db/mysql
      HFG_UUID_JDBC_TYPE: CHAR
      HFG_DB_USERNAME: hfg
      HFG_DB_PASSWORD: hfg-test-password
      HFG_ADMIN_PASSWORD: hfg-test-admin-password
      HFG_RPC_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17, cache: maven}
      - run: >-
          ./mvnw --batch-mode -pl hfg-manager-api -am
          -Dtest=ManagerContextIntegrationTest,BusinessLogsIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false test

  centos7-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17, cache: maven}
      - name: Build and test snapshot key generator
        run: ./mvnw --batch-mode -pl hfg-common-contract -am test package
      - name: Verify JDK 17 Ed25519 in CentOS 7 userspace
        run: |
          mkdir -p "${RUNNER_TEMP}/hfg-centos7-keys"
          docker run --rm \
            -v "${JAVA_HOME}:/opt/java:ro" \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -v "${RUNNER_TEMP}/hfg-centos7-keys:/keys" \
            quay.io/centos/centos:7 \
            /opt/java/bin/java -cp /workspace/hfg-common-contract/target/hfg-common-contract-0.1.1.jar \
            io.github.scholiarw.hfg.contract.SnapshotKeyTool /keys
          grep -q '^HFG_SNAPSHOT_PRIVATE_KEY_BASE64=' "${RUNNER_TEMP}/hfg-centos7-keys/hfg-snapshot-manager.env"
          grep -q '^HFG_SNAPSHOT_PUBLIC_KEY_BASE64=' "${RUNNER_TEMP}/hfg-centos7-keys/hfg-snapshot-gateway.env"
      - name: Validate CentOS 7 deployment files
        run: |
          bash -n deploy/keepalived/hfg-gateway-health.sh scripts/package-linux-x86_64.sh
          ! grep -Eq 'AmbientCapabilities|TasksMax|ProtectSystem=strict' deploy/systemd/centos7/*.service

  release-linux-x86_64:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-x64]')
    needs: [backend, mysql-context, centos7-compat]
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    env:
      HFG_RELEASE_VERSION: 0.1.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17, cache: maven}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hfg-manager-web/package-lock.json
      - name: Verify x86_64 builder
        run: test "$(uname -m)" = x86_64 && test "${{ runner.arch }}" = X64
      - name: Build manager and gateway release JARs
        run: |
          npm ci
          npm run build
          cd ..
          ./mvnw --batch-mode -Dhfg.bundle-web=true -DskipTests clean package
        working-directory: hfg-manager-web
      - name: Assemble native deployment medium
        run: ./scripts/package-linux-x86_64.sh "$HFG_RELEASE_VERSION"
      - name: Build linux/amd64 runtime images
        run: |
          MEDIA_DIR="dist/hfg-${HFG_RELEASE_VERSION}-linux-x86_64"
          docker build --platform linux/amd64 \
            -f "$MEDIA_DIR/docker/Dockerfile.manager" \
            -t "hfg-manager:${HFG_RELEASE_VERSION}" "$MEDIA_DIR"
          docker build --platform linux/amd64 \
            -f "$MEDIA_DIR/docker/Dockerfile.gateway" \
            -t "hfg-gateway:${HFG_RELEASE_VERSION}" "$MEDIA_DIR"
          test "$(docker image inspect "hfg-manager:${HFG_RELEASE_VERSION}" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "hfg-gateway:${HFG_RELEASE_VERSION}" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          docker save "hfg-manager:${HFG_RELEASE_VERSION}" "hfg-gateway:${HFG_RELEASE_VERSION}" \
            | gzip -9 > "dist/hfg-${HFG_RELEASE_VERSION}-linux-x86_64-docker-images.tar.gz"
          cd dist
          sha256sum hfg-*.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${HFG_RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release delete "v${HFG_RELEASE_VERSION}" --cleanup-tag --yes
          fi
          gh release create "v${HFG_RELEASE_VERSION}" \
            "dist/hfg-${HFG_RELEASE_VERSION}-linux-x86_64.tar.gz" \
            "dist/hfg-${HFG_RELEASE_VERSION}-linux-x86_64-docker-images.tar.gz" \
            "dist/SHA256SUMS" \
            "target/bom.json#bom.json" \
            --target "$GITHUB_SHA" \
            --title "HFG ${HFG_RELEASE_VERSION} Linux x86_64" \
            --notes "Linux x86_64 release. Includes the Native Java deployment medium, prebuilt linux/amd64 Manager and Gateway Docker images, SHA-256 checksums, SBOM, and the step-by-step deployment guide." \
            --latest
