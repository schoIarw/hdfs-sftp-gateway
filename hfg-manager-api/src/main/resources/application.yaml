spring:
  application:
    name: hfg-manager-api
  datasource:
    url: ${HFG_DB_URL:jdbc:postgresql://127.0.0.1:5432/hfg}
    username: ${HFG_DB_USERNAME:hfg}
    password: ${HFG_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HFG_DB_POOL_SIZE:20}
      minimum-idle: ${HFG_DB_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${HFG_MANAGER_PORT:8080}
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  metrics.tags.application: hfg-manager-api
hfg:
  security:
    admin:
      username: ${HFG_ADMIN_USERNAME:admin}
      password: ${HFG_ADMIN_PASSWORD}
  snapshot:
    signing-private-key-base64: ${HFG_SNAPSHOT_PRIVATE_KEY_BASE64:}
  prometheus:
    base-url: ${HFG_PROMETHEUS_URL:http://127.0.0.1:9090}
  rpc:
    enabled: ${HFG_RPC_ENABLED:true}
    port: ${HFG_RPC_PORT:19090}
    server-certificate: ${HFG_RPC_SERVER_CERT:/etc/hfg/pki/manager.crt}
    server-private-key: ${HFG_RPC_SERVER_KEY:/etc/hfg/pki/manager.key}
    ca-certificate: ${HFG_RPC_CA:/etc/hfg/pki/ca.crt}
