spring:
  application:
    name: hfg-manager-api
  datasource:
    url: ${HFG_DB_URL:jdbc:postgresql://127.0.0.1:5432/hfg}
    username: ${HFG_DB_USERNAME:hfg}
    password: ${HFG_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HFG_DB_POOL_SIZE:20}
      minimum-idle: ${HFG_DB_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties:
      hibernate.type.preferred_uuid_jdbc_type: ${HFG_UUID_JDBC_TYPE:UUID}
  flyway:
    enabled: true
    locations: ${HFG_DB_MIGRATION_LOCATION:classpath:db/migration}
  servlet.multipart:
    max-file-size: 32MB
    max-request-size: 34MB
server:
  port: ${HFG_MANAGER_PORT:8080}
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  metrics.tags.application: hfg-manager-api
hfg:
  security:
    admin:
      username: ${HFG_ADMIN_USERNAME:admin}
      password: ${HFG_ADMIN_PASSWORD}
  snapshot:
    signing-private-key-base64: ${HFG_SNAPSHOT_PRIVATE_KEY_BASE64:}
    signing-public-key-base64: ${HFG_SNAPSHOT_PUBLIC_KEY_BASE64:}
    auto-publish-interval: ${HFG_SNAPSHOT_AUTO_PUBLISH_INTERVAL:PT2S}
    reconcile-initial-delay: ${HFG_SNAPSHOT_RECONCILE_INITIAL_DELAY:PT15S}
    reconcile-interval: ${HFG_SNAPSHOT_RECONCILE_INTERVAL:PT5M}
    retry-delay: ${HFG_SNAPSHOT_RETRY_DELAY:PT30S}
  prometheus:
    # 关闭后管理界面的监控查询显示“未开启”，相关接口返回 503。
    enabled: ${HFG_PROMETHEUS_ENABLED:true}
    base-url: ${HFG_PROMETHEUS_URL:http://127.0.0.1:9090}
    # 认证方式：token（Bearer，优先）或 username/password（Basic）；都为空表示匿名访问。
    username: ${HFG_PROMETHEUS_USERNAME:}
    password: ${HFG_PROMETHEUS_PASSWORD:}
    token: ${HFG_PROMETHEUS_TOKEN:}
    request-timeout: ${HFG_PROMETHEUS_TIMEOUT:PT10S}
    # 状态接口探测 /-/healthy 的超时
    health-timeout: ${HFG_PROMETHEUS_HEALTH_TIMEOUT:PT2S}
  logs:
    url: ${HFG_LOGS_DB_URL:}
    username: ${HFG_LOGS_DB_USERNAME:${HFG_DB_USERNAME:hfg}}
    password: ${HFG_LOGS_DB_PASSWORD:${HFG_DB_PASSWORD}}
    pool-size: ${HFG_LOGS_DB_POOL_SIZE:10}
    retention-days: ${HFG_LOGS_RETENTION_DAYS:180}
    precreate-days: ${HFG_LOGS_PRECREATE_DAYS:7}
  hdfs-bundles:
    path: ${HFG_HDFS_BUNDLE_PATH:/var/lib/hfg/hdfs-bundles}
  rpc:
    enabled: ${HFG_RPC_ENABLED:true}
    port: ${HFG_RPC_PORT:19090}
    server-certificate: ${HFG_RPC_SERVER_CERT:/etc/hfg/pki/manager.crt}
    server-private-key: ${HFG_RPC_SERVER_KEY:/etc/hfg/pki/manager.key}
    ca-certificate: ${HFG_RPC_CA:/etc/hfg/pki/ca.crt}
    ca-private-key: ${HFG_RPC_CA_KEY:/etc/hfg/pki/ca.key}
    ca-private-key-password: ${HFG_RPC_CA_KEY_PASSWORD:}
    gateway-certificate-validity-days: ${HFG_GATEWAY_CERT_VALIDITY_DAYS:365}
