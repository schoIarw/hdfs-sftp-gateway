spring:
  application:
    name: hfg-gateway
server:
  address: ${HFG_MANAGEMENT_BIND:127.0.0.1}
  port: ${HFG_MANAGEMENT_PORT:18080}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  metrics.tags:
    application: hfg-gateway
    gateway: ${HFG_GATEWAY_ID}
hfg:
  gateway-id: ${HFG_GATEWAY_ID}
  service-group-id: ${HFG_SERVICE_GROUP_ID}
  snapshot:
    path: ${HFG_SNAPSHOT_PATH:/var/lib/hfg/snapshot.json}
    verification-public-key-base64: ${HFG_SNAPSHOT_PUBLIC_KEY_BASE64}
    event-wal-path: ${HFG_EVENT_WAL_PATH:/var/lib/hfg/events.wal}
    event-report-interval: ${HFG_EVENT_REPORT_INTERVAL:PT5S}
  rpc:
    host: ${HFG_RPC_HOST}
    port: ${HFG_RPC_PORT:19090}
    server-name: ${HFG_RPC_SERVER_NAME:${HFG_RPC_HOST}}
    ca-certificate: ${HFG_RPC_CA:/etc/hfg/pki/ca.crt}
    client-certificate: ${HFG_RPC_CLIENT_CERT:/etc/hfg/pki/gateway.crt}
    client-private-key: ${HFG_RPC_CLIENT_KEY:/etc/hfg/pki/gateway.key}
    advertised-address: ${HFG_NODE_IP}
    management-port: ${HFG_MANAGEMENT_PORT:18080}
    heartbeat-interval: ${HFG_HEARTBEAT_INTERVAL:PT10S}
  hdfs:
    runtime-path: ${HFG_HDFS_RUNTIME_PATH:/var/lib/hfg/hdfs-runtime}
    refresh-interval: ${HFG_HDFS_REFRESH_INTERVAL:PT1M}
  concurrency:
    max-active-transfers: ${HFG_MAX_ACTIVE_TRANSFERS:120}
    max-uploads: ${HFG_MAX_UPLOADS:80}
    max-downloads: ${HFG_MAX_DOWNLOADS:80}
    acquire-timeout: ${HFG_TRANSFER_ACQUIRE_TIMEOUT:PT10S}
  ftp:
    enabled: ${HFG_FTP_ENABLED:true}
    bind-address: ${HFG_FTP_BIND:0.0.0.0}
    port: ${HFG_FTP_PORT:21}
    passive-ports: ${HFG_FTP_PASSIVE_PORTS:30000-31000}
    active-mode-enabled: ${HFG_FTP_ACTIVE_MODE:false}
    idle-timeout-seconds: ${HFG_FTP_IDLE_TIMEOUT:300}
    max-logins: ${HFG_FTP_MAX_LOGINS:200}
    worker-threads: ${HFG_FTP_WORKER_THREADS:128}
  sftp:
    enabled: ${HFG_SFTP_ENABLED:true}
    bind-address: ${HFG_SFTP_BIND:0.0.0.0}
    port: ${HFG_SFTP_PORT:22}
    host-key-path: ${HFG_SFTP_HOST_KEY:/etc/hfg/ssh_host_ed25519_key}
    # 留空时自动识别已有主机密钥类型（EC/EdDSA/RSA），无法识别时按 MINA 默认 EC 生成
    host-key-algorithm: ${HFG_SFTP_HOST_KEY_ALGORITHM:}
    idle-timeout-seconds: ${HFG_SFTP_IDLE_TIMEOUT:300}
    max-sessions: ${HFG_SFTP_MAX_SESSIONS:200}
    max-channels: ${HFG_SFTP_MAX_CHANNELS:200}
    max-channels-per-session: ${HFG_SFTP_MAX_CHANNELS_PER_SESSION:4}
    worker-threads: ${HFG_SFTP_WORKER_THREADS:128}
logging:
  level:
    # Apache FtpServer 默认逐条打印命令与应答（FtpLoggingFilter 的 RECEIVED/SENT）
    # 以及各命令实现类的 INFO 日志，对排障价值低却会淹没日志，因此只保留 WARN 及以上。
    # 登录与传输结果由 HFG 自己输出精简单行审计日志。
    org.apache.ftpserver: WARN
